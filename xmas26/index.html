<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BBBros X'mas26 計算機</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+JP:wght@400;600&display=swap">
<style>
/* Layout: single column of item rows, sticky total bar at bottom */
:root{
  --bg:#f3f6f4; --card:#ffffff; --fg:#17251f; --muted:#5d6e66; --line:#dbe4df;
  --pine:#1f6b4a; --berry:#c8323c; --gold:#b8862a; --warn-bg:#fdecec;
  --display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  --body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --card:#17221d; --fg:#e8f0ec; --muted:#93a59c; --line:#26352e;
  --pine:#4fbf8a; --berry:#ff6b72; --gold:#e3b357; --warn-bg:#3a1d20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --card:#17221d; --fg:#e8f0ec; --muted:#93a59c; --line:#26352e;
  --pine:#4fbf8a; --berry:#ff6b72; --gold:#e3b357; --warn-bg:#3a1d20; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px}
header{display:grid;gap:4px;margin-bottom:16px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--berry);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.25;margin:0;text-wrap:balance}
.meta{font-size:13px;color:var(--muted)}
.meta b{color:var(--fg);font-weight:600}
.list{display:grid;gap:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.item.over{border-color:var(--berry);background:linear-gradient(var(--warn-bg),var(--warn-bg)) padding-box}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.name{font-weight:600;min-width:0;flex:1}
.thumb{flex:none;width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.name a{color:inherit;text-decoration:none}
.name a:hover{text-decoration:underline}
.price{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.limit{flex:none;font-size:12px;font-weight:600;color:var(--pine);border:1px solid currentColor;border-radius:999px;padding:1px 9px;white-space:nowrap}
.item.over .limit{color:var(--berry)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{font-variant-numeric:tabular-nums;font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:18px;line-height:1;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button,input,a{touch-action:manipulation}
.mem.full{border-color:var(--berry)}
.mem.full span{color:var(--berry)}
.step button:disabled{opacity:.35;cursor:default}
.step button:focus-visible,.copy:focus-visible,input:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.step output{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.members{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mem{border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:grid;gap:4px;justify-items:center}
.mem span{font-size:13px;font-weight:600}
.mem .step button{width:30px;height:30px;font-size:16px}
.note{font-size:12px;color:var(--muted)}
.ship{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 14px}
.ship label{font-size:14px}
.ship input{width:110px;font:inherit;font-size:16px;font-variant-numeric:tabular-nums;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.foot{font-size:12px;color:var(--muted);margin-top:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
.tot small{display:block;font-size:12px;color:var(--muted)}
.tot strong{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px}
.copy{border:0;border-radius:999px;padding:10px 14px;font:600 13px var(--body);background:var(--pine);color:var(--card);cursor:pointer}
.copy.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.copy.alt{background:var(--berry)}
.modal{position:fixed;inset:0;z-index:10;background:rgba(10,20,16,.72);display:grid;place-items:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:16px;padding:14px;display:grid;gap:10px;max-width:420px;width:100%;max-height:100%;overflow:auto}
.sheet img{width:100%;border-radius:10px;border:1px solid var(--line)}
.sheet p{margin:0;font-size:12px;color:var(--muted);text-align:center}
.sheet .acts{display:flex;gap:8px;justify-content:center}
.sheet a.copy{text-decoration:none;display:inline-block}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .2s,background .2s}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow">BOOM BOOM BROTHERS ・ NEW</div>
    <h1>BBBros X'mas26 グッズ計算機</h1>
    <div class="meta">販売開始 <b>10/16(金) 20:00</b> ・ 発送 11/16(月)〜順次 ・ 価格は税込</div>
  </header>
  <div class="list" id="list"></div>
  <div class="ship">
    <label for="ship">送料・手数料（任意）</label>
    <input id="ship" type="number" inputmode="numeric" min="0" step="10" placeholder="0">
  </div>
  <p class="foot">購入制限は各商品ページの表記（2026/10/15確認）。キーチェーンは各メンバー3点までで計算しています。</p>
</div>

<div class="bar"><div class="in">
  <div class="tot"><small id="count">0点</small><strong id="total">¥0</strong></div>
  <div class="btns">
    <button class="copy ghost" id="reset" type="button">リセット</button>
    <button class="copy" id="copy" type="button">内訳コピー</button>
    <button class="copy alt" id="shot" type="button">画像で保存</button>
  </div>
</div></div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-label="結果画像">
    <img id="shotImg" alt="計算結果の画像">
    <p>保存できない場合は、画像を長押しして保存してください。</p>
    <div class="acts">
      <a class="copy" id="dl" download="bbbros-xmas26.png" href="#">ダウンロード</a>
      <button class="copy ghost" id="close" type="button">閉じる</button>
    </div>
  </div>
</div>

<script>
const BASE="https://bmsg.shop/products/bbbros-xmas26-";
const ITEMS=[
  {id:"kc",name:"オーナメントキーチェーン",price:1900,limit:3,url:BASE+"%E3%82%AA%E3%83%BC%E3%83%8A%E3%83%A1%E3%83%B3%E3%83%88%E3%82%AD%E3%83%BC%E3%83%81%E3%82%A7%E3%83%BC%E3%83%B3",
   members:["C-Sea","Qubo","K2","RCB","Jed","Dabby"],perMember:true},
  {id:"plate",name:"プレート",price:3800,limit:3,url:BASE+"%E3%83%97%E3%83%AC%E3%83%BC%E3%83%88"},
  {id:"blanket",name:"ブランケット",price:3500,limit:3,url:BASE+"%E3%83%96%E3%83%A9%E3%83%B3%E3%82%B1%E3%83%83%E3%83%88"},
  {id:"tree",name:"ツリー",price:4400,limit:3,url:BASE+"%E3%83%84%E3%83%AA%E3%83%BC"},
  {id:"shopper",name:"リユーザブルショッパー",price:1100,limit:3,url:BASE+"%E3%83%AA%E3%83%A6%E3%83%BC%E3%82%B6%E3%83%96%E3%83%AB%E3%82%B7%E3%83%A7%E3%83%83%E3%83%91%E3%83%BC"},
  {id:"charm",name:"ランダムマーカーチャーム",price:800,limit:10,url:BASE+"%E3%83%A9%E3%83%B3%E3%83%80%E3%83%A0%E3%83%9E%E3%83%BC%E3%82%AB%E3%83%BC%E3%83%81%E3%83%A3%E3%83%BC%E3%83%A0",
   note:"全6種・ランダム（種類は選べません）"}
];
const IMG={"kc": "images/bbbros-xmas26-ornament-keychain.webp", "plate": "images/bbbros-xmas26-plate.webp", "blanket": "images/bbbros-xmas26-blanket.webp", "tree": "images/bbbros-xmas26-tree.webp", "shopper": "images/bbbros-xmas26-reusable-shopper.webp", "charm": "images/bbbros-xmas26-random-marker-charm.webp"};
const yen=n=>"¥"+n.toLocaleString("ja-JP");
let q={};
try{q=JSON.parse(localStorage.getItem("bbb26")||"{}")||{}}catch(e){q={}}
const save=()=>{try{localStorage.setItem("bbb26",JSON.stringify(q))}catch(e){}};
const qty=(it)=>it.members?it.members.reduce((s,m)=>s+(q[it.id+":"+m]||0),0):(q[it.id]||0);
const atCap=(it,k)=>it.perMember?(q[k]||0)>=it.limit:qty(it)>=it.limit;
const limText=(it,n)=>it.perMember?`${n}点 ・ 各${it.limit}点まで`:`${n} / ${it.limit}点`;

function stepper(key,label){
  return `<div class="step"><button type="button" data-k="${key}" data-d="-1" aria-label="${label}を減らす">−</button><output id="o-${key}">0</output><button type="button" data-k="${key}" data-d="1" aria-label="${label}を増やす">＋</button></div>`;
}
const list=document.getElementById("list");
list.innerHTML=ITEMS.map(it=>`
  <section class="item" id="it-${it.id}">
    <div class="top">
      <img class="thumb" src="${IMG[it.id]}" alt="${it.name}" width="72" height="72">
      <div class="name"><a href="${it.url}" target="_blank" rel="noopener">${it.name}</a><div class="price">${yen(it.price)}</div></div>
      <span class="limit" id="lim-${it.id}">${limText(it,0)}</span>
    </div>
    ${it.members?`<div class="members">${it.members.map(m=>`<div class="mem" id="m-${it.id}:${m}"><span>${m}</span>${stepper(it.id+":"+m,m)}</div>`).join("")}</div>`:""}
    ${it.note?`<div class="note">${it.note}</div>`:""}
    <div class="row">${it.members?`<span class="note">メンバー合計</span>`:stepper(it.id,it.name)}<span class="sub" id="sub-${it.id}">¥0</span></div>
  </section>`).join("");

const ship=document.getElementById("ship");
try{const s=localStorage.getItem("bbb26ship");if(s)ship.value=s}catch(e){}

function render(){
  let total=0,count=0;
  ITEMS.forEach(it=>{
    const n=qty(it);count+=n;total+=n*it.price;
    document.getElementById("sub-"+it.id).textContent=yen(n*it.price);
    document.getElementById("lim-"+it.id).textContent=limText(it,n);
    document.getElementById("it-"+it.id).classList.toggle("over",!it.perMember&&n>=it.limit);
    const keys=it.members?it.members.map(m=>it.id+":"+m):[it.id];
    keys.forEach(k=>{
      document.getElementById("o-"+k).textContent=q[k]||0;
      document.querySelector(`[data-k="${k}"][data-d="-1"]`).disabled=!(q[k]>0);
      document.querySelector(`[data-k="${k}"][data-d="1"]`).disabled=atCap(it,k);
      const mem=document.getElementById("m-"+k);if(mem)mem.classList.toggle("full",atCap(it,k));
    });
  });
  const sh=Math.max(0,parseInt(ship.value,10)||0);
  document.getElementById("count").textContent=`${count}点`+(sh?`（送料等 ${yen(sh)} 込み）`:"");
  document.getElementById("total").textContent=yen(total+sh);
}
list.addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]");if(!b)return;
  const k=b.dataset.k,it=ITEMS.find(i=>i.id===k.split(":")[0]),d=+b.dataset.d;
  if(d>0&&atCap(it,k))return;
  q[k]=Math.max(0,(q[k]||0)+d);save();render();
});
ship.addEventListener("input",()=>{try{localStorage.setItem("bbb26ship",ship.value)}catch(e){}render()});
document.getElementById("reset").addEventListener("click",()=>{q={};ship.value="";save();try{localStorage.removeItem("bbb26ship")}catch(e){}render()});
document.getElementById("copy").addEventListener("click",async e=>{
  const lines=[];let total=0;
  ITEMS.forEach(it=>{
    const n=qty(it);if(!n)return;total+=n*it.price;
    const det=it.members?"（"+it.members.filter(m=>q[it.id+":"+m]).map(m=>m+"×"+q[it.id+":"+m]).join("・")+"）":"";
    lines.push(`${it.name} ×${n}${det} ${yen(n*it.price)}`);
  });
  const sh=Math.max(0,parseInt(ship.value,10)||0);
  if(sh)lines.push(`送料等 ${yen(sh)}`);
  lines.push(`合計 ${yen(total+sh)}`);
  const text="BBBros X'mas26\n"+lines.join("\n");
  const btn=e.currentTarget;
  try{await navigator.clipboard.writeText(text);btn.textContent="コピーしました";}
  catch(err){btn.textContent="コピーできませんでした";}
  setTimeout(()=>btn.textContent="内訳コピー",1600);
});
/* 結果画像 */
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,text,maxW){
  const out=[];let line="";
  for(const ch of text){if(c.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}else line+=ch;}
  if(line)out.push(line);return out;
}
async function makeShot(){
  const DISP='"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif', BODY='"Noto Sans JP","Hiragino Sans",sans-serif';
  const sample="BBBros X'mas 2026 お買い物リスト合計点送料等円各0123456789¥×・"+ITEMS.map(i=>i.name+(i.members||[]).join("")).join("");
  try{await Promise.all([document.fonts.load(`800 40px ${DISP}`,sample),document.fonts.load(`600 30px ${BODY}`,sample),document.fonts.load(`400 26px ${BODY}`,sample)]);}catch(e){}
  const rows=ITEMS.map(it=>({it,n:qty(it)})).filter(r=>r.n);
  const imgs={};await Promise.all(rows.map(async r=>{imgs[r.it.id]=await loadImg(IMG[r.it.id]);}));
  const W=1080,P=56,TH=150,TW=W-P*2;
  const meas=document.createElement("canvas").getContext("2d");meas.font=`400 26px ${BODY}`;
  const detailLines=r=>r.it.members?wrap(meas,r.it.members.filter(m=>q[r.it.id+":"+m]).map(m=>m+"×"+q[r.it.id+":"+m]).join("・"),TW-TH-40-200):[];
  const rowH=r=>Math.max(TH,96+detailLines(r).length*36)+28;
  const sh=Math.max(0,parseInt(ship.value,10)||0);
  const H=230+(rows.length?rows.reduce((s,r)=>s+rowH(r),0):140)+(sh?70:0)+190+70;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  c.fillStyle="#f3f6f4";c.fillRect(0,0,W,H);
  // ヘッダー
  c.fillStyle="#8e1f28";c.fillRect(0,0,W,200);
  c.fillStyle="rgba(255,255,255,.08)";for(let x=-200;x<W;x+=80){c.beginPath();c.moveTo(x,0);c.lineTo(x+40,100);c.lineTo(x,200);c.lineTo(x-40,100);c.closePath();c.fill();}
  c.fillStyle="#f5d78e";c.font=`600 26px ${BODY}`;c.textBaseline="alphabetic";c.fillText("BOOM BOOM BROTHERS  X'mas 2026",P,82);
  c.fillStyle="#ffffff";c.font=`800 58px ${DISP}`;c.fillText("お買い物リスト",P,152);
  let y=230;
  if(!rows.length){c.fillStyle="#5d6e66";c.font=`400 30px ${BODY}`;c.fillText("まだ何も選んでいません",P,y+60);y+=140;}
  let total=0,count=0;
  for(const r of rows){
    const h=rowH(r)-28,sub=r.n*r.it.price;total+=sub;count+=r.n;
    c.fillStyle="#ffffff";rr(c,P,y,TW,h,22);c.fill();c.strokeStyle="#dbe4df";c.lineWidth=2;c.stroke();
    const im=imgs[r.it.id];
    if(im){const iy=y+(h-(TH-32))/2;c.save();rr(c,P+16,iy,TH-32,TH-32,14);c.clip();c.drawImage(im,P+16,iy,TH-32,TH-32);c.restore();}
    const tx=P+TH+8;
    c.fillStyle="#17251f";c.font=`600 32px ${BODY}`;c.fillText(r.it.name,tx,y+52);
    c.fillStyle="#5d6e66";c.font=`400 26px ${BODY}`;c.fillText(`${yen(r.it.price)} × ${r.n}点`,tx,y+92);
    detailLines(r).forEach((l,i)=>c.fillText(l,tx,y+128+i*36));
    c.fillStyle="#1f6b4a";c.font=`800 40px ${DISP}`;c.textAlign="right";c.fillText(yen(sub),P+TW-24,y+h/2+14);c.textAlign="left";
    y+=h+28;
  }
  if(sh){c.fillStyle="#5d6e66";c.font=`400 28px ${BODY}`;c.fillText("送料・手数料",P+8,y+36);c.textAlign="right";c.fillText(yen(sh),P+TW-24,y+36);c.textAlign="left";y+=70;}
  // 合計
  c.fillStyle="#1f6b4a";rr(c,P,y,TW,160,26);c.fill();
  c.fillStyle="#d7efe3";c.font=`600 28px ${BODY}`;c.fillText(`合計 ${count}点`+(sh?"（送料等込み）":""),P+32,y+66);
  c.fillStyle="#ffffff";c.font=`800 72px ${DISP}`;c.textAlign="right";c.fillText(yen(total+sh),P+TW-32,y+118);c.textAlign="left";
  y+=190;
  c.fillStyle="#5d6e66";c.font=`400 22px ${BODY}`;c.fillText("販売開始 10/16(金) 20:00 ・ 価格は税込",P,y+20);
  return cv.toDataURL("image/png");
}
const modal=document.getElementById("modal");
document.getElementById("shot").addEventListener("click",async e=>{
  const btn=e.currentTarget;btn.disabled=true;btn.textContent="作成中…";
  try{const url=await makeShot();document.getElementById("shotImg").src=url;document.getElementById("dl").href=url;modal.hidden=false;}
  catch(err){alert("画像を作れませんでした。もう一度お試しください。");}
  btn.disabled=false;btn.textContent="画像で保存";
});
document.getElementById("close").addEventListener("click",()=>{modal.hidden=true});
modal.addEventListener("click",e=>{if(e.target===modal)modal.hidden=true});
render();
</script>
</body>
</html>
